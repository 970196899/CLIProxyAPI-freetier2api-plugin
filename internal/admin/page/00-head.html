<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeTier 2API</title>
<style>
:root {
  color-scheme: dark;
  /* AURORA NIGHT — 深色玻璃界面（在浅色版基础上压暗两档，保持同一套动效与布局） */
  --bg: #12141A; --fg: #E6E8ED; --muted: #8B909B; --card: rgba(30,33,40,.86); --pop: #1B1E25; /* 浮层专用不透明底色：下拉菜单压在表格上，透过去会糊 */
  --glass: rgba(28,31,38,.72); --raised: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.085); --border-strong: rgba(255,255,255,.17);
  --accent: #7FA6C8; --accent-2: #5C7C97;
  --accent-soft: rgba(127,166,200,.14); --accent-line: rgba(127,166,200,.32);
  --grad: linear-gradient(135deg,#5C7C97 0%,#4A6D8C 45%,#3B5163 100%);
  --ok: #6FBF93; --ok-soft: rgba(111,191,147,.14);
  --warn: #D2A85F; --warn-soft: rgba(210,168,95,.14);
  --err: #E0847A; --err-soft: rgba(224,132,122,.14);
  --row-hover: rgba(127,166,200,.08);
  --shadow-card: 0 1px 2px rgba(0,0,0,.32), 0 8px 24px -12px rgba(0,0,0,.55);
  --shadow-pop: 0 2px 6px rgba(0,0,0,.38), 0 22px 48px -20px rgba(0,0,0,.72);
  --radius: 14px;
  /* 供应商彩色芯片：vendorChipClass() 按 vendor_id 哈希取 v0..v5（深色下抬亮前景、压低底色） */
  --chip-0-bg: rgba(167,139,250,.16); --chip-0-fg: #C4B5FD;
  --chip-1-bg: rgba(34,211,238,.14);  --chip-1-fg: #7DD3FC;
  --chip-2-bg: rgba(251,191,36,.14);  --chip-2-fg: #FCD34D;
  --chip-3-bg: rgba(251,113,133,.14); --chip-3-fg: #FDA4AF;
  --chip-4-bg: rgba(74,222,128,.14);  --chip-4-fg: #86EFAC;
  --chip-5-bg: rgba(96,165,250,.14);  --chip-5-fg: #93C5FD;
  /* 动效 token（AURORA） */
  --d1:180ms; --d2:320ms; --d3:620ms;
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --ff:-apple-system,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --ff-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--fg);
  font: var(--f-4,14px)/1.55 var(--ff);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  background: var(--bg); isolation: isolate;
}
/* 环境光：两团低饱和色光，给玻璃一个可折射的背景（AURORA）。
   独立成一张固定合成层 —— 用 background-attachment: fixed 时，滚动会让
   整块 body 背景重新光栅化，高刷屏上直接掉帧。translateZ(0) 让它一次性
   上屏后由合成器平移，滚动期间零重绘。 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(46vmax 46vmax at -8% -12%, rgba(92,124,151,.22), transparent 66%),
    radial-gradient(40vmax 40vmax at 108% 6%, rgba(120,104,150,.16), transparent 66%);
  transform: translateZ(0);
}
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ---- 头部：slim 渐变头带（宿主外壳悬浮按钮压在右上，保持低调不打架） ---- */
header { margin: 14px 20px 0; border-radius: var(--radius); padding: 16px 22px;
         background: var(--glass); border: 1px solid var(--border);
         box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
header::before { content: ""; position: absolute; width: 300px; height: 300px; border-radius: 50%;
                 right: -70px; top: -160px;
                 background: radial-gradient(circle, rgba(127,166,200,.13), transparent 65%); }
header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.3px; color: var(--fg); }
.sub { color: var(--muted); font-size: 12.5px; }
header .sub { color: var(--muted); margin-top: 2px; }
main { padding: 14px 20px 48px; }

/* 卡片不再挂 backdrop-filter：卡片背后只有一张静止的环境光渐变，
   模糊结果恒定 —— 每帧重算等于白烧 GPU，滚动时尤其明显。用不透明度和
   边框维持玻璃观感，视觉几乎无差，滚动成本降到零。 */
.card { background: var(--glass); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
        box-shadow: var(--shadow-card); }
.card h2 { margin: 0 0 12px; font-size: 14.5px; font-weight: 700;
           display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.card h2::before { content: ""; width: 9px; height: 9px; border-radius: 3px;
                   background: var(--grad); flex: none; box-shadow: 0 0 10px rgba(127,166,200,.35); }
.card h2 .muted { font-weight: 400; font-size: 12.5px; }

[hidden], [hidden="true"], [hidden=""] { display: none !important; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row[hidden] { display: none !important; }
/* 输入框宽度按份数表达（.grow 一份 / .grow-2 两份）。
   以前写在内联 style 里，内联 specificity 最高，窄屏想改只能上 !important。 */
.row > .grow { flex: 1 1 0; min-width: 0; }
.row > .grow-2 { flex: 2 1 0; min-width: 0; }
button.act { padding: 6.5px 13px; border: 1px solid var(--border-strong); border-radius: 9px;
             background: var(--card); color: var(--fg); cursor: pointer; font-size: 13px; font-weight: 550;
             /* 只过渡合成器属性：background/border-color/color 是离散色变，
                box-shadow 与 filter 每帧都要重新光栅化，高刷下 hover 会发黏。 */
             transition: background .12s ease, border-color .12s ease, color .12s ease,
                         transform .08s ease; }
button.act:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button.act:active { transform: scale(.98); }
button.act:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--grad); border: 1px solid transparent; color: #fff;
                 box-shadow: 0 4px 14px -4px rgba(0,0,0,.55); }
button.primary:hover { background: var(--grad); filter: brightness(1.08); color: #fff;
                       transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(0,0,0,.7); }
button.primary:active { transform: scale(.98); }
/* 删除等危险操作：默认与普通按钮一致，悬停才转红（对应 JS 里的 "act danger"）。 */
button.act.danger:hover:not(:disabled) { color: var(--err); border-color: var(--err); background: var(--err-soft); }

table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px;
        font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7.5px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
/* 表头吸顶只对随页面滚动的表格生效。#models 是 overflow-x 滚动容器，
   纵向也被计算为 auto，吸顶落不到视口上，故模型表不吸顶（预期，非缺陷）。 */
thead th { position: sticky; top: -1px; z-index: 1;
           background: rgba(24,27,33,.96);
           color: var(--muted); font-size: 11.5px; font-weight: 650; letter-spacing: .05em;
           border-bottom: 1px solid var(--border-strong); }
/* 行悬停不做过渡：鼠标沿长表格快速划过时，每行都会起一个 120ms 的背景动画，
   十几个动画同时跑就是在和滚动抢帧。瞬时着色反而更跟手。 */
tbody tr:hover td { background: var(--row-hover); }
tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr:last-child td { border-bottom: none; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th.sortable .th-sort-wrap { display: inline-flex; align-items: center; gap: 3px; line-height: 1; vertical-align: middle; }
.sort-arrows { display: inline-flex; flex-direction: column; justify-content: center; align-items: center;
               position: relative; top: -1px; }
.sort-arrow { display: block; width: 0; height: 0; border-left: 3px solid transparent;
              border-right: 3px solid transparent; transition: border-color .15s ease; }
.sort-arrow.asc { border-bottom: 4px solid var(--muted); margin-bottom: 2px; }
.sort-arrow.desc { border-top: 4px solid var(--muted); }
.sort-arrows.order-asc .sort-arrow.asc { border-bottom-color: var(--accent); }
.sort-arrows.order-desc .sort-arrow.desc { border-top-color: var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px;
        border-radius: 999px; font-size: 11.5px; font-weight: 550;
        background: var(--raised); border: 1px solid var(--border); color: var(--fg); }
.pill.v0 { background: var(--chip-0-bg); color: var(--chip-0-fg); border-color: transparent; }
.pill.v1 { background: var(--chip-1-bg); color: var(--chip-1-fg); border-color: transparent; }
.pill.v2 { background: var(--chip-2-bg); color: var(--chip-2-fg); border-color: transparent; }
.pill.v3 { background: var(--chip-3-bg); color: var(--chip-3-fg); border-color: transparent; }
.pill.v4 { background: var(--chip-4-bg); color: var(--chip-4-fg); border-color: transparent; }
.pill.v5 { background: var(--chip-5-bg); color: var(--chip-5-fg); border-color: transparent; }
.pill.ok   { color: var(--ok);   background: var(--ok-soft);   border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.err  { color: var(--err);  background: var(--err-soft);  border-color: transparent; }
.pill.ok::before, .pill.warn::before, .pill.err::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* 阈值仪表：渐变填充，剩余比例高=绿 / 中=琥珀 / 低=红 */
.bar { position: relative; display: inline-block; width: 72px; height: 6px;
       border-radius: 4px; background: var(--border); vertical-align: middle; overflow: hidden; }
/* 用 transform 而不是 width 做填充：width 动画每帧触发 layout + paint，
   表格里一排仪表同时动就是几十次重排；scaleX 只走合成器。 */
.bar i { display: block; height: 100%; width: 100%; border-radius: 4px;
         background: linear-gradient(90deg, #6FBF93, #3E7A57);
         transform: scaleX(0); transform-origin: left center;
         transition: transform .3s var(--ease-out); }
.bar.warn i { background: linear-gradient(90deg, #D2A85F, #9A7736); }
.bar.err  i { background: linear-gradient(90deg, #E0847A, #A85B52); }

.muted { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
/* 终端日志：双主题恒定暗色内嵌面板 */
.logbox { max-height: 420px; overflow: auto; font: 11.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
          background: #0b1220; color: #cbd5e1; border: 1px solid rgba(148,163,184,.18);
          border-radius: 10px; padding: 12px 14px; box-shadow: inset 0 1px 6px rgba(0,0,0,.35); }
.logbox div { white-space: pre-wrap; word-break: break-all; }
.logbox .ERROR { color: #f87171; }
.logbox .DEBUG { color: #7c8ca3; }
.logbox .WARN { color: #fbbf24; }
.logbox .INFO { color: #7dd3fc; }

label { display: inline-flex; align-items: center; gap: 6px; }
input[type=text], input[type=number], input[type=password], select {
  padding: 6.5px 10px; border: 1px solid var(--border-strong);
  border-radius: 9px; background: var(--card); color: var(--fg); font-size: 13px;
  transition: border-color .12s ease, box-shadow .12s ease; }
select { cursor: pointer; }
input[type=text]:hover, input[type=number]:hover, input[type=password]:hover, select:hover { border-color: var(--muted); }
input[type=text]:focus, input[type=number]:focus, input[type=password]:focus, select:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
/* 回调链接很长，用等宽字体 + 手动换行才看得出参数有没有粘全。 */
textarea { padding: 7px 11px; border: 1px solid var(--border-strong); border-radius: 10px;
        background: var(--card); color: var(--fg); font-size: 13px; width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
/* 表格内联输入：点击别名后出现，贴合表格行高。 */
input.aliasinput { padding: 3px 7px; width: 100%; min-width: 96px; font-size: 12.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
input.aliasinput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
/* 表格内联编辑（模型 ID / 账号别名共用）：文字可点击进入编辑，右侧 ✎ 给出暗示。 */
.editable { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            border-bottom: 1px dashed var(--border-strong); padding: 1px 2px; }
.editable:hover { color: var(--accent); border-bottom-color: var(--accent); }
.editable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.editableedit { color: var(--muted); font-size: 11.5px; }
.editable:hover .editableedit { color: var(--accent); }

#models { overflow-x: auto; }
#models table { min-width: 980px; }
#models .col-check { width: 1%; text-align: center; padding-left: 8px; padding-right: 4px; }
#models .col-status, #models .col-vendor { width: 1%; white-space: nowrap; }
#models .editablename { display: inline-block; max-width: clamp(120px, 14vw, 200px);
  overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
#models .name-text { display: inline-block; max-width: clamp(80px, 10vw, 150px);
  overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
#models .col-credits { min-width: 90px; white-space: nowrap; }
#models .col-context, #models .col-output { min-width: 76px; white-space: nowrap; }
#models .col-caps { min-width: 105px; white-space: nowrap; }
#models .col-efforts { min-width: 150px; white-space: nowrap; }

/* 列展示：贴按钮行最右侧；菜单靠右展开，避免超出视口。 */
.cols-setter { margin-left: auto; }
.dropdown { position: relative; display: inline-block; }
/* max-height + 纵向滚动：供应商有 16 个，菜单不加限制会超出卡片底部，
   尾部渠道既看不见也滚不到（菜单靠 liftMenuCard 把所在卡片抬到最上层）。 */
.dropdown-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
                 min-width: 210px; max-height: min(72vh, 560px); overflow: hidden auto;
                 overscroll-behavior: contain;
                 background: var(--pop); border: 1px solid var(--border);
                 border-radius: 12px; box-shadow: var(--shadow-pop); padding: 4px; }
/* 菜单展开时把所在卡片抬到后续卡片之上，否则跨卡片溢出部分被遮住。 */
.card.menu-open { position: relative; z-index: 30; }
.dropdown-menu.right { left: auto; right: 0; }
.dropdown-menu button { display: block; width: 100%; padding: 7.5px 12px; border: 0; border-radius: 8px;
                        background: transparent; color: var(--fg); text-align: left;
                        cursor: pointer; font-size: 13px; transition: background .1s ease; }
.dropdown-menu button:hover { background: var(--accent-soft); color: var(--accent); }
.dropdown-menu label { display: flex; align-items: center; gap: 8px;
                       padding: 8px 12px; cursor: pointer; font-size: 13px; border-radius: 8px; }
.dropdown-menu label:hover { background: var(--raised); }
.dropdown-menu label.disabled { cursor: not-allowed; opacity: .7; }

/* 上限 + 滚动：一键做任务会把 8 个账号的结果拼成一段长文案，不限高时
   390px 视口下横幅能长到 200px 以上，把账号表格整块挤出首屏。 */
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px;
          display: none; transition: opacity .2s ease; border: 1px solid transparent;
          border-left-width: 3px; white-space: pre-line;
          max-height: min(38vh, 180px); overflow-y: auto; overscroll-behavior: contain;
          position: relative; }
.banner.show { display: block; }
/* 常驻横幅（duration=0）不会自动消失，必须给一个显式关闭入口，
   否则只能等下一次操作把它替换掉。 */
.banner.persist { padding-right: 38px; }
.banner-close { position: absolute; top: 6px; right: 8px; width: 24px; height: 24px;
                display: none; align-items: center; justify-content: center; padding: 0;
                border: 0; border-radius: 6px; background: transparent; color: inherit;
                font-size: 16px; line-height: 1; cursor: pointer; opacity: .6; }
.banner.persist .banner-close { display: flex; }
.banner-close:hover { opacity: 1; background: rgba(127, 127, 127, .16); }
.banner-close:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; opacity: 1; }
.banner.err  { background: var(--err-soft);  border-left: 3px solid var(--err);  color: var(--err); }
.banner.ok   { background: var(--ok-soft);   border-left: 3px solid var(--ok);   color: var(--ok); }
.banner.warn { background: var(--warn-soft); border-left: 3px solid var(--warn); color: var(--warn); }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
/* ---- 套餐领取弹窗 ---- */
.modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center;
         justify-content: center; padding: 20px; background: rgba(6,8,12,.68); backdrop-filter: blur(4px); }
.modal[hidden] { display: none !important; }
.modal-box { width: 100%; max-width: 620px; max-height: 86vh; overflow: auto;
             padding: 20px; background: #1B1E24; border: 1px solid var(--border);
             border-radius: 16px; box-shadow: var(--shadow-pop); }
.modal-box h2 { margin-top: 0; }
.plan { padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
.plan:hover { border-color: var(--accent); }
.plan.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.plan-title { font-weight: 650; }
.plan-grants { margin-top: 6px; font-size: 13px; color: var(--muted); }
.claim-captcha { min-height: 68px; margin: 12px 0; display: flex;
                 align-items: center; justify-content: center; }
/* 登录面板的人机验证落点：与领取弹窗同款，但高度只在滑块出现时占位。 */
.login-captcha { min-height: 0; margin: 10px 0 0; display: flex;
                 align-items: center; justify-content: flex-start; }
.login-captcha[hidden] { display: none !important; }
.claim-row { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

/* 折叠块：默认收起，标题行常显（登录/领取回调粘贴框）。 */
details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }

/* 响应式：平板（≤900px）。桌面端（>900px）完全不受影响，以下只在窄屏生效。 */
@media (max-width: 900px) {
  header { margin: 10px 12px 0; padding: 13px 16px; }
  header h1 { font-size: 17.5px; }
  main { padding: 12px 12px 36px; }
  .card { padding: 14px 15px; }
  th, td { padding: 7px 8px; }
  /* 账号表在窄屏改为横向滚动，避免 8 列 nowrap 撑破视口。
     滚动容器只包表格本身：#accounts 是纯表格容器——加在整张 .card 上会把
     <h2> 标题和错误行一起卷进滚动。代价：该表在该断点下不再吸顶（overflow-x
     会让 overflow-y 计算为 auto），窄屏本来也没有吸顶价值。 */
  #accounts { overflow-x: auto; }
  #models table { min-width: 820px; }
}

/* 响应式：手机（≤640px）。 */
@media (max-width: 640px) {
  header { margin: 8px 8px 0; padding: 12px 14px; }
  header h1 { font-size: 16px; }
  header .sub { font-size: 11.5px; }
  main { padding: 10px 8px 30px; }
  .card { padding: 12px; }
  .card h2 { font-size: 13.5px; margin-bottom: 10px; }
  th, td { padding: 6.5px 7px; font-size: 12px; }
  /* 输入框独占一行。宽度来源已是 .grow/.grow-2 而非内联样式，
     属性选择器 specificity 更高，直接覆盖即可，无需 !important。
     flex-basis 非 auto 时 width 不参与主轴尺寸计算，故不写 width。 */
  .row > input[type=text], .row > input[type=password], .row > input[type=number],
  .row > input[type=tel] {
    flex: 1 1 100%;
  }
  /* 行内控件先让 label 可压缩，控件才跟着收窄，不会撑破视口。 */
